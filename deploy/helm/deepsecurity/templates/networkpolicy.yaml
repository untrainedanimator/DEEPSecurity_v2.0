{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deepsecurity.fullname" . }}
  labels:
    {{- include "deepsecurity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "deepsecurity.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowDatabase }}
    - to: []
      ports:
        - protocol: TCP
          port: 5432   # postgres
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowRedis }}
    - to: []
      ports:
        - protocol: TCP
          port: 6379   # redis
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowAuditSink }}
    - to: []
      ports:
        - protocol: TCP
          port: 443    # webhook (HTTPS)
        - protocol: UDP
          port: 514    # syslog
        - protocol: TCP
          port: 514    # syslog (TCP)
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
