{{- /*
Secret holds the values that must NEVER appear in a values.yaml or git
history. Operator populates these via:

    helm install deepsec deepsecurity \
      --set-string secrets.secretKey="$(openssl rand -hex 32)" \
      --set-string secrets.jwtSecret="$(openssl rand -hex 32)" \
      --set-string secrets.databasePassword=...

Or, preferred, via External Secrets Operator / Sealed Secrets so the
key material never touches a CLI history. The chart deliberately
generates new secret keys at install time if not provided so a
greenfield deploy still works — but those values then live only in
the cluster's etcd and rotation requires a `helm upgrade` with new
explicit values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deepsecurity.fullname" . }}
  labels:
    {{- include "deepsecurity.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEC_SECRET_KEY: {{ .Values.secrets.secretKey | default (randAlphaNum 48) | quote }}
  DEEPSEC_JWT_SECRET: {{ .Values.secrets.jwtSecret | default (randAlphaNum 48) | quote }}
  {{- if .Values.config.oidc.enabled }}
  DEEPSEC_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- with .Values.secrets.auditSinkWebhookToken }}
  DEEPSEC_AUDIT_SINK_WEBHOOK_TOKEN: {{ . | quote }}
  {{- end }}
