name: release

on:
  push:
    tags: ["v*"]

jobs:
  docker-publish:
    name: publish image
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to attach SBOM + checksums to the release
      packages: write
      security-events: write   # to upload Trivy SARIF
      id-token: write          # to mint OIDC token for cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build (load locally for scan)
        id: build_local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: deepsecurity:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pre-publish vulnerability gate — never publish a HIGH/CRITICAL image.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: deepsecurity:release-candidate
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-release'

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: deepsecurity:release-candidate
          format: cyclonedx-json
          output-file: sbom-${{ github.ref_name }}.cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 90

      # Publish only after Trivy passes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore keyless signing of the published image + SBOM attestation.
      # Runs only after Trivy passes and the image is pushed to GHCR.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            echo "Signing $tag"
            cosign sign --yes "$tag"
          done

      - name: Attach SBOM as cosign attestation
        env:
          COSIGN_EXPERIMENTAL: "true"
          TAGS: ${{ steps.meta.outputs.tags }}
          SBOM_FILE: sbom-${{ github.ref_name }}.cyclonedx.json
        run: |
          # The anchore/sbom-action above writes the SBOM under the name used here.
          # Re-symlink to the canonical name expected by cosign attest.
          cp "$SBOM_FILE" sbom.cdx.json
          for tag in $TAGS; do
            echo "Attesting SBOM for $tag"
            cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$tag"
          done

      - name: Attach SBOM + SARIF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-${{ github.ref_name }}.cyclonedx.json
            trivy-results.sarif
