name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
    env:
      # Provide test secrets that pass validation.
      DEEPSEC_SECRET_KEY: ${{ secrets.DEEPSEC_SECRET_KEY || '0123456789abcdef0123456789abcdef' }}
      DEEPSEC_JWT_SECRET: ${{ secrets.DEEPSEC_JWT_SECRET || 'fedcba9876543210fedcba9876543210' }}
      # Pytest must NEVER pick up the production "user_risk" watchdog autostart.
      DEEPSEC_ENV: test
      DEEPSEC_WATCHDOG_AUTOSTART: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check deepsecurity tests

      - name: Format check
        run: ruff format --check deepsecurity tests

      # Type-check is now FAIL-FAST. v2.5.0 — no more `|| true`.
      - name: Type-check
        run: mypy deepsecurity

      - name: Test
        run: pytest --cov=deepsecurity --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage.xml
          path: coverage.xml
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: lint-and-test
    outputs:
      image-id: ${{ steps.build.outputs.imageid }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: deepsecurity:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Container vulnerability scan (FAIL-FAST on HIGH/CRITICAL) -----
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: deepsecurity:ci
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-image'

      # ----- SBOM (CycloneDX) -----
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: deepsecurity:ci
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx.json
          path: sbom-cyclonedx.json
          retention-days: 30

  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pip-audit is now FAIL-FAST. v2.5.0 — no more `|| true`.
      - name: Install + audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict
