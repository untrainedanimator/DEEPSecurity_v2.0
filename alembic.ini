# Alembic configuration for DEEPSecurity.
#
# The database URL is taken from DEEPSEC_DATABASE_URL at runtime via
# migrations/env.py — we deliberately do NOT hardcode it here. That keeps the
# same migration script working against SQLite (single-node), Postgres
# (compose / SaaS), and any test fixture URL.
#
# Common operations:
#   alembic upgrade head              # apply all pending migrations
#   alembic revision -m "msg" --autogenerate
#   alembic downgrade -1              # roll back one revision
#   alembic current                   # show current head
#   alembic history --verbose

[alembic]
script_location = migrations
prepend_sys_path = .
# v2.5: alembic 1.13+ wants ``path_separator`` set explicitly; without it
# every Alembic command emits a DeprecationWarning that pytest's
# ``filterwarnings = ["error", ...]`` promotes to a fatal error. ``os``
# means "use the host OS's path separator" — semicolon on Windows, colon
# on POSIX — which is what we want for ``prepend_sys_path``.
path_separator = os
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# Auto-format new revisions with ruff if available.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
