[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsecurity"
version = "3.1.0"
description = "User-space policy, DLP, and compliance overlay for endpoints — runs alongside your AV, not a replacement. MITRE-tagged detections, SIEM-ready events, audit trails, and compliance reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dino" }]
keywords = ["security", "dlp", "compliance", "audit", "policy", "mitre-attack", "siem"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "Flask>=3.0,<4.0",
  "flask-cors>=5.0",
  "flask-jwt-extended>=4.7",
  "gunicorn>=23.0",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0",
  "joblib>=1.3",
  "psutil>=6.0",
  "structlog>=24.0",
  "click>=8.1",
  # v2.5.0: schema migrations always shipped with the runtime.
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]
# ML layer — requires scikit-learn (pulls numpy + scipy).
# Only needed if you actually load a sklearn model via DEEPSEC_ML_MODEL_PATH.
# On Python 3.14, these don't have Windows wheels yet — use Python 3.12.
ml = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
]
# Real-time watchdog.
watchdog = ["watchdog>=4.0"]
# YARA rules.
yara = ["yara-python>=4.5"]
# v3.1 — YARA-based memory scanner. Same dep as ``yara`` extra; named
# separately so ``deepsec[memory-yara]`` reads cleanly in deploy docs.
memory-yara = ["yara-python>=4.5"]
# Outlook attachment scanner — Windows only.
windows = ["pywin32; sys_platform == 'win32'"]
# PostgreSQL driver — required if DEEPSEC_DATABASE_URL points at postgres.
postgres = ["psycopg[binary]>=3.2"]
# OIDC identity provider (v2.5.0). Optional only because some single-node
# deployments stay on the dev-password fallback for local-only use.
oidc = ["authlib>=1.3", "requests>=2.31"]

# Distributed state backend (v2.5.0). Required only if you set
# DEEPSEC_STATE_BACKEND=redis to run more than one replica.
redis = ["redis>=5.0"]

# v3.0 BEASTMODE — Windows-only feature extras.
# ETW real-time event ingestion via pywintrace (FireEye, MIT). The
# Python module name is ``etw`` — that's how the code imports it. The
# package is ``pywintrace`` on PyPI.
edr = [
  "pywin32; sys_platform == 'win32'",
  "pywintrace>=0.2.0; sys_platform == 'win32'",
]
# WinDivert-backed inline packet filter (drops on policy match).
firewall = ["pydivert>=2.1; sys_platform == 'win32'"]
# Local DNS sinkhole (Pi-hole-style domain blocking on the laptop).
dns = ["dnslib>=0.9", "dnspython>=2.6"]
# Opt-in TLS inspection — heavy, ~30 MB. Off by default.
tls-proxy = ["mitmproxy>=10"]
# Built-in HTTPS for the backend (v3.0.0). cryptography is already a
# transitive dep via authlib; this extra makes the dependency explicit
# so ``deepsec start --tls-self-signed`` works without authlib.
tls = ["cryptography>=41"]
# External audit-log sinks (v3.0.0). requests for webhook + stdlib for
# syslog/file. Listed as an explicit extra so the dep is documented.
audit-sinks = ["requests>=2.31"]
# Aggregate Windows-only EDR stack.
windows-edr = [
  "pywin32; sys_platform == 'win32'",
  "pywintrace>=0.2.0; sys_platform == 'win32'",
  "pydivert>=2.1; sys_platform == 'win32'",
  "dnslib>=0.9",
]

# Everything the scanner can do, enabled.
all = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "watchdog>=4.0",
  "yara-python>=4.5",
  "psycopg[binary]>=3.2",
  "pywin32; sys_platform == 'win32'",
  "authlib>=1.3",
  "requests>=2.31",
  "redis>=5.0",
]

[project.scripts]
deepsec = "deepsecurity.cli:main"
deepsecurity = "deepsecurity.cli:main"
deepsec-agent = "deepsecurity.agent.cli:main"

[project.urls]
Homepage = "https://github.com/your-account/deepsecurity"
Issues = "https://github.com/your-account/deepsecurity/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepsecurity*"]
exclude = ["tests*", "_legacy*", "frontend*", "deploy*"]

# --- Tooling --------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: tests that need real OS artefacts (processes, rate-storms). Skipped by default.",
  "live_windows: v3.0 BEASTMODE tests that need an elevated Windows shell. Skipped in CI; run with `pytest -m live_windows` from an admin prompt.",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:flask_socketio.*",
  "ignore::DeprecationWarning:engineio.*",
  # SQLAlchemy's QueuePool keeps a small set of sqlite3.Connection
  # objects alive between sessions. When pytest tears down the process
  # the Python GC finalises them and emits ResourceWarning("unclosed
  # database ..."). That's a GC-timing artefact on Python 3.14, NOT a
  # real connection leak — our conftest teardown calls engine.dispose()
  # and gc.collect() explicitly. The warning otherwise gets promoted
  # to error by the "error" filter above and crashes pytest cleanup
  # after every green run.
  "ignore:unclosed database:ResourceWarning",
  # Same cause, different pytest wrapper — the unraisable-exception
  # collector wraps the ResourceWarning in its own class.
  "ignore::pytest.PytestUnraisableExceptionWarning",
  # structlog 25.5.0 ConsoleRenderer emits a UserWarning ("Remove
  # `format_exc_info` from your processor chain if you want pretty
  # exceptions") whenever ``_log.exception()`` is called under the dev
  # renderer. Our processor chain is correct for production (JSON);
  # the warning is cosmetic in dev. ``filterwarnings = ["error", ...]``
  # would otherwise promote it to a fatal that crashes any test which
  # exercises an exception path through the logger.
  "ignore:Remove .format_exc_info. from your processor chain:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["deepsecurity"]
omit = ["deepsecurity/cli.py", "deepsecurity/outlook.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_legacy", "frontend", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PTH", "RUF"]
ignore = [
  # --- Test / development conveniences -------------------------------
  "S101",  # allow assert in tests
  "S105",  # hardcoded password warnings — config layer rejects placeholders
  "S603",  # subprocess without shell — every call site sanitises args
  # --- Security rules deliberately not applicable here ---------------
  # S310 — `urllib.request.urlopen`. Every call in this codebase is to
  # HTTPS, syslog, or an operator-configured webhook. The "permitted
  # schemes" warning is for projects that pass user-controlled URLs;
  # ours are config-driven.
  "S310",
  # S110 — `try-except-pass`. Used as a deliberate best-effort pattern
  # in boot-time integrity checks, watchdog parsing, JWT optional
  # decoding, etc. — places where the next layer is allowed to fail
  # silently. Each occurrence is documented inline.
  "S110",
  # S607 — `taskkill` on Windows uses a partial executable path by
  # design (it's a system command resolved via PATH).
  "S607",
  # S108 — `Path("/tmp")` literals in watchdog_monitor.py are NAMES of
  # standard system temp dirs, not paths we create files at. The actual
  # tempfile usage goes through tempfile.mkstemp.
  "S108",
  # --- Stylistic unicode in human-readable text ----------------------
  # RUF001/RUF003 — en-dash and multiplication-sign in comments and
  # human-facing strings (compliance template titles, regulator
  # citations, README excerpts) are deliberate typographic choices.
  "RUF001",
  "RUF003",
  # --- v3.0 deliberate patterns --------------------------------------
  # S104 — string literals "0.0.0.0" and "127.0.0.1" appear in our DNS
  # sinkhole as (a) /etc/hosts-style FORMAT discriminators inside
  # blocklists.py, and (b) a sinkhole-reply CONSTANT in server.py.
  # Neither is a bind-address use; the actual server binds at
  # ``settings.dns_sinkhole_bind`` (default 127.0.0.1).
  "S104",
  # S314 — xml.etree on our own ETW Event-Log render. Input is
  # OS-emitted XML, not untrusted user data. We accept the rule
  # rather than pull defusedxml just for this one parse site.
  "S314",
  # --- SIM rules: stylistic, kept off to avoid churn against existing
  # coding patterns the team has standardised on.
  "SIM102",
  "SIM103",
  "SIM105",
  "SIM108",
  # --- PTH rules: same — partial migration to pathlib is fine.
  "PTH101",
  "PTH106",
  "PTH111",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S311", "B017"]
"scripts/*" = [
  "S101",
  # Legacy v2.4 e2e/smoke scripts — leave their style alone.
  "RUF002",   # en-dash in docstrings (intentional human text)
  "F841",     # unused local variable (deliberate "ignore for now" assigns)
  "RUF059",   # unused unpacked variable (status/code tuples)
  "E501",     # long log lines and stage-summary strings
]
"migrations/versions/*" = [
  # Migration scripts are operator-authored DDL, not application code.
  # The S608 "SQL injection" rule is a false positive whenever a
  # migration uses ``sa.text(f"...{constant}...")`` to interpolate a
  # module-level constant (table name, column name) — the f-string is
  # never reached by user input. Suppress the rule for the whole
  # migrations tree rather than peppering noqa across every revision.
  "S608",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["deepsecurity"]
exclude = ["_legacy/", "frontend/", "tests/fixtures/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "joblib.*",
  "psutil.*",
  "flask_socketio.*",
  "sklearn.*",
  "pythoncom.*",
  "win32com.*",
  # v3.0 EDR layer — pywin32 sub-modules don't ship py.typed; we don't
  # want to pull types-pywin32 (it's a partial mirror that lags) and
  # we already wrap every call site with try/except.
  "win32api.*",
  "win32event.*",
  "win32evtlog.*",
  "win32process.*",
  "win32service.*",
  "win32serviceutil.*",
  "servicemanager.*",
  # Third-party EDR/security deps without py.typed.
  "etw.*",
  "pydivert.*",
  "dnslib.*",
  "flask_cors.*",
  "authlib.*",
  # v3.0 audit-sinks uses requests; skipping the types-requests dep to
  # keep the test extras lean — call sites are wrapped in try/except.
  "requests.*",
  # mitmproxy 12.x uses ``type X = ...`` (Python 3.12+ syntax) which
  # mypy 1.20 on Python 3.14 doesn't grok inside the package. We don't
  # actually call mitmproxy at type-check time — it's an opt-in extra
  # only loaded when the TLS proxy is enabled.
  "mitmproxy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
